name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # The app targets Windows (systray, clipboard, WebView2), so run tests on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required by SonarQube for blame/PR decoration.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: cmd/gui/frontend/package.json
          cache: npm
          cache-dependency-path: cmd/gui/frontend/package-lock.json

      - name: Build frontend assets
        working-directory: cmd/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        run: go test -coverprofile='coverage.out' ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: goinstall
          args: --timeout=5m

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Uncomment the next line if you use a self-hosted SonarQube instance
          # instead of SonarCloud.
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
