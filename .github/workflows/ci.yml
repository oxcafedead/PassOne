name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # The app targets Windows (systray, clipboard, WebView2), so run tests on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required by SonarQube for blame/PR decoration.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cmd/gui/frontend/package.json
          cache: npm
          cache-dependency-path: cmd/gui/frontend/package-lock.json

      - name: Build frontend assets
        working-directory: cmd/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        run: go test -coverprofile='coverage.out' ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Uncomment the next line if you use a self-hosted SonarQube instance
          # instead of SonarCloud.
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
