name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # The app targets Windows (systray, clipboard, WebView2), so run tests on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required by SonarQube for blame/PR decoration.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cmd/gui/frontend/package.json
          cache: npm
          cache-dependency-path: cmd/gui/frontend/package-lock.json

      - name: Build frontend assets
        working-directory: cmd/gui/frontend
        run: |
          npm ci
          npm run build

      - name: Run frontend DOM smoke tests
        # Mounts App.svelte in jsdom against a window.go/window.runtime stand-in
        # and drives the real flows: unlock, reveal, edit, create, delete,
        # auto-lock. This is the gate for a control that renders, looks enabled
        # and is permanently inert. The real generated wailsjs modules stay in
        # the loop; cmd/gui/binding_contract_test.go checks those against *App.
        working-directory: cmd/gui/frontend
        run: npm test

      - name: Run tests with coverage
        # Use an absolute path for the coverage profile. The relative-path form of
        # `go test -coverprofile` is unreliable on Windows: the profile is resolved
        # relative to the test binary's working directory and is frequently not
        # written (or only partially written), producing a corrupt/missing file.
        # Coverage runs without -race (the race runtime is far slower and the
        # instrumented binaries are not the ones shipped); the race gate is the
        # separate step below.
        shell: pwsh
        run: |
          go test -coverprofile="$env:GITHUB_WORKSPACE\coverage.out" ./...
          go run ./tools/coveragecheck -profile="$env:GITHUB_WORKSPACE\coverage.out" -threshold=70

      - name: Run tests with the race detector
        # The Wails bridge dispatches every binding call on its own goroutine, so
        # unsynchronized access to App state is reachable in production, not just
        # in theory. `-race` needs the race runtime, which requires cgo and
        # therefore a C compiler: windows-latest has one (gcc via mingw), but
        # CGO_ENABLED must be set explicitly because it defaults to 0 when no C
        # compiler is detected at Go install time.
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

      # The GUI exe only receives its icon, manifest and version info when Wails
      # runs its packaging step. Building it in CI (without -nopackage) and then
      # asserting the icon resource guards against icon-less builds regressing.
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build GUI binary
        working-directory: cmd/gui
        shell: pwsh
        run: wails build -skipbindings -s -clean

      - name: Verify GUI icon is embedded
        shell: pwsh
        run: go run ./tools/checkicon cmd/gui/build/bin/passone-ui.exe

      - name: SonarQube Scan
        # Dependabot-triggered runs have a read-only GITHUB_TOKEN and no access to
        # secrets (SONAR_TOKEN), which makes the scan fail. Skip it for Dependabot.
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Uncomment the next line if you use a self-hosted SonarQube instance
          # instead of SonarCloud.
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
