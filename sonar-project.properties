# SonarQube / SonarCloud project metadata.

sonar.organization=oxcafedead
sonar.projectKey=oxcafedead_passone

sonar.projectName=passone
sonar.projectVersion=1.0

# Paths.
sonar.sources=.
sonar.tests=.

# Exclude generated artifacts, frontend dependencies and build outputs.
sonar.exclusions=\
  **/node_modules/**,\
  **/frontend/dist/**,\
  **/build/bin/**,\
  **/build/windows/**,\
  **/build/darwin/**,\
  **/wailsjs/**

sonar.test.inclusions=**/*_test.go

# Coverage report produced by the CI workflow.
sonar.go.coverage.reportPaths=coverage.out
