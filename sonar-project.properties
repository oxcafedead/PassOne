# SonarQube / SonarCloud project metadata.

sonar.organization=oxcafedead
sonar.projectKey=oxcafedead_passone

sonar.projectName=passone
sonar.projectVersion=1.0

# Paths.
sonar.sources=.
sonar.tests=.

# Exclude generated artifacts, frontend dependencies and build outputs.
sonar.exclusions=\
  **/node_modules/**,\
  **/frontend/dist/**,\
  **/build/bin/**,\
  **/build/windows/**,\
  **/build/darwin/**,\
  **/wailsjs/**

# Test files. `**/*_test.go` covers the Go side, but on its own it classifies the
# whole frontend harness -- test/app.test.ts (950 lines), bridge.ts, runtime.ts and
# setup.ts -- as *production* code, which is both wrong and expensive: the harness
# is measured as uncovered product and every finding in it counts against the
# quality gate as though a user could reach it.
sonar.test.inclusions=**/*_test.go,**/frontend/test/**

# Coverage exclusions. Anything here is removed from the coverage denominator, so
# it must only ever list code that cannot be measured by this pipeline:
#
#   - the frontend harness, which is test code (see sonar.test.inclusions above);
#   - the build/test configs, which are declarations rather than behaviour;
#   - tests/interop, a PowerShell harness that needs a built exe and a real GnuPG
#     install, so it can never run in CI and can never be covered there.
#
# Deliberately NOT excluded: src/main.ts. It is 9 lines and currently uncovered,
# but it is product code, and hiding it would flatter the number.
sonar.coverage.exclusions=**/frontend/test/**,**/frontend/vite.config.ts,**/frontend/vitest.config.ts,**/frontend/svelte.config.js,tests/interop/**

# Coverage report produced by the CI workflow. Go only, and that is the whole of
# it: the frontend has 9 lines of TypeScript outside its tests, and SonarCloud
# does not analyse .svelte at all, so an lcov report would move this metric by
# roughly nothing. See AGENTS.md, "Sonar cannot see the Svelte UI".
sonar.go.coverage.reportPaths=coverage.out
