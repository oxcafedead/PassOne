# SonarQube / SonarCloud project metadata.
# Fill in your own organization and project key below, then commit the file.

sonar.organization=your-sonarcloud-organization
sonar.projectKey=your-sonarcloud-project-key

sonar.projectName=passone
sonar.projectVersion=1.0

# Paths.
sonar.sources=.
sonar.tests=.

# Exclude generated artifacts, frontend dependencies and build outputs.
sonar.exclusions=\
  **/node_modules/**,\
  **/frontend/dist/**,\
  **/build/bin/**,\
  **/build/windows/**,\
  **/build/darwin/**,\
  **/wailsjs/**

sonar.test.inclusions=**/*_test.go

# Coverage report produced by the CI workflow.
sonar.go.coverage.reportPaths=coverage.out
